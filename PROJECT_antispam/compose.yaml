name: project-antispam

services:
  antispam:
    image: project-antispam:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${ANTISPAM_PORT:-8000}:8000"
    environment:
      MODEL_DIR: /app/microservice/app/model
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
